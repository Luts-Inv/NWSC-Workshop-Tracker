  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbxtzQYb3R2_5Evtz9-Cdtnd85cCfpsOmcpZVK6sCVXaigP_1FREztWi25cuDaMPEvXVsA/exec";

    let html5QrcodeScanner = null;
    let scannerRunning = false;

    window.addEventListener('load', function () {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('entry-date').value = today;
      document.getElementById('date-received').value = today;
    });

    function switchTab(tab) {
      const genTab = document.getElementById('tab-gen');
      const scanTab = document.getElementById('tab-scan');
      const genSec = document.getElementById('section-generate');
      const scanSec = document.getElementById('section-scan');

      if (tab === 'generate') {
        genTab.classList.add('active');
        scanTab.classList.remove('active');
        genSec.style.display = 'block';
        scanSec.style.display = 'none';
        stopScanner();
      } else {
        genTab.classList.remove('active');
        scanTab.classList.add('active');
        genSec.style.display = 'none';
        scanSec.style.display = 'block';
        startScanner();
      }
    }

    function generateRecordId() {
      const station = (document.getElementById('station').value || 'GEN')
        .trim().toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 5) || 'GEN';
      const timePart = Date.now().toString().slice(-6);
      return `NWSC-${station}-P-${timePart}`;
    }

    function collectFormData() {
      let recordId = (document.getElementById('record-id').value || '').trim();
      let entryDate = (document.getElementById('entry-date').value || '').trim();

      if (!recordId) {
        recordId = generateRecordId();
        document.getElementById('record-id').value = recordId;
      }
      if (!entryDate) {
        entryDate = new Date().toISOString().split('T')[0];
        document.getElementById('entry-date').value = entryDate;
      }

      return {
        action: 'save',
        recordId: recordId,
        entryDate: entryDate,
        assetNumber: document.getElementById('asset-num').value.trim(),
        serialNumber: document.getElementById('serial-num').value.trim(),
        pumpManufacturer: document.getElementById('pump-man').value.trim(),
        pumpModel: document.getElementById('pump-model').value.trim(),
        pumpType: document.getElementById('pump-type').value,
        pumpCapacity: document.getElementById('pump-cap').value,
        motorRating: document.getElementById('motor-rate').value,
        motorSerialNumber: document.getElementById('motor-serial').value.trim(),
        station: document.getElementById('station').value.trim(),
        location: document.getElementById('location').value.trim(),
        deliveredBy: document.getElementById('delivered-by').value.trim(),
        dateReceived: document.getElementById('date-received').value,
        faultReported: document.getElementById('fault-reported').value.trim(),
        condition: document.getElementById('condition').value
      };
    }

    function validateData(data) {
      const required = [
        ['Record ID', data.recordId],
        ['NWSC Asset Number', data.assetNumber],
        ['Serial Number', data.serialNumber],
        ['Pump Manufacturer', data.pumpManufacturer],
        ['Pump Model', data.pumpModel],
        ['Station', data.station]
      ];

      const missing = required.filter(item => !item[1]).map(item => item[0]);
      if (missing.length) {
        alert('Please complete these fields:\n\n' + missing.join('\n'));
        return false;
      }
      return true;
    }

    function buildQrPayload(recordId) {
      return SHEET_URL + '?action=get&recordId=' + encodeURIComponent(recordId);
    }

    function showQrCode(recordId) {
      const box = document.getElementById('qr-output-container');
      const qr = document.getElementById('qr-code');
      const title = document.getElementById('qr-title-label');

      qr.innerHTML = '';
      new QRCode(qr, {
        text: buildQrPayload(recordId),
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.H
      });

      title.textContent = 'Asset QR: ' + recordId;
      box.style.display = 'flex';
    }

    async function registerAsset() {
      const button = document.getElementById('submit-btn');
      const status = document.getElementById('cloud-status');
      const data = collectFormData();

      if (!validateData(data)) return;

      button.disabled = true;
      button.textContent = 'SAVING...';
      status.textContent = 'Saving asset record...';
      status.style.color = '#1d4ed8';

      // Generate the QR immediately so the asset is still usable even if the cloud request fails.
      showQrCode(data.recordId);

      try {
        const body = new URLSearchParams(data);
        const response = await fetch(SHEET_URL, {
          method: 'POST',
          body: body
        });

          throw new Error('Server returned HTTP ' + response.status);
